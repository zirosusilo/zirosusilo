<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gambar Layar Penuh Tanpa Distorsi</title>
  <style>
    /* Reset sederhana */
    html,body {
      height:100%;
      margin:0;
    }

    /* Kontainer layar penuh */
    .fullscreen {
      width:100vw;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      background-color:#000;
    }

    /* Gambar: gunakan object-fit untuk menjaga rasio */
    .fullscreen img {
      width:100%;
      height:100%;
      object-fit:cover; /* cover: mengisi layar tanpa mendistorsi (bisa terpotong)
                           contain: jika tidak mau terpotong, ganti ke contain (akan ada ruang kosong) */
      object-position:center center;
      display:block;
    }

    /* Opsional: tombol kecil pengganti mode cover/contain untuk demo */
    .controls {
      position:fixed;
      left:12px;
      top:12px;
      background:rgba(255,255,255,0.9);
      padding:6px 8px;
      border-radius:6px;
      font-family:system-ui,Arial,Segoe UI;
      font-size:14px;
    }

    .controls button { margin-right:6px; }
  </style>
</head>
<body>

  <div class="fullscreen">
    <!-- Ganti src dengan path gambar Anda -->
    <img id="bg" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=1920&auto=format&fit=crop" alt="Gambar layar penuh">
  </div>

  <div class="controls" aria-hidden="false">
    <button onclick="setFit('cover')">Cover (isi layar, tidak distorsi)</button>
    <button onclick="setFit('contain')">Contain (tanpa crop, tidak distorsi)</button>
  </div>

  <script>
    function setFit(mode){
      document.getElementById('bg').style.objectFit = mode;
    }
  </script>

</body>
</html>
